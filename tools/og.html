<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OG card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    color: #fff;
    background:
      radial-gradient(760px 460px at 6% -8%, rgba(76, 139, 247, .50), transparent 62%),
      radial-gradient(700px 540px at 106% 106%, rgba(14, 165, 233, .32), transparent 62%),
      linear-gradient(158deg, #061733, #0b2a5c 46%, #143a7f);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(155deg, #000 0%, transparent 74%);
  }
  .cone {
    position: absolute; right: -30px; bottom: -40px;
    width: 560px; height: 560px; opacity: .16;
  }
  .wrap { position: relative; padding: 64px 76px; height: 100%; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 14px; }
  .mark { width: 42px; height: 42px; display: block; color: #7fb2ff; }
  .brand b { display: block; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .brand i { display: block; font-style: normal; font-size: 11.5px; letter-spacing: .28em; color: rgba(255,255,255,.5); margin-top: 3px; }

  h1 { margin-top: 66px; font-size: 62px; line-height: 1.16; font-weight: 700; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: #8ec0ff; }

  p.lead { margin-top: 22px; font-size: 21px; line-height: 1.62; color: rgba(255,255,255,.76); max-width: 780px; }

  .tags { margin-top: auto; display: flex; gap: 12px; }
  .tag {
    font-size: 15px; padding: 9px 18px; border-radius: 999px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.18);
    color: rgba(255,255,255,.88);
  }
  .tag.hot { background: rgba(96,165,250,.22); border-color: rgba(142,192,255,.45); color: #cfe3ff; }
</style>
</head>
<body>
<div class="grid"></div>

<svg class="cone" viewBox="0 0 32 32" fill="none" stroke="#8ec0ff" stroke-width="1.1" stroke-linecap="round">
  <path d="M9.9 16C15 11.2 18.4 8.2 24.8 5.2"/>
  <path d="M9.9 16h14.9"/>
  <path d="M9.9 16C15 20.8 18.4 23.8 24.8 26.8"/>
  <circle cx="7" cy="16" r="2.8" fill="#8ec0ff" stroke="none"/>
</svg>

<div class="wrap">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
      <path d="M9.9 16C15 11.2 18.4 8.2 24.8 5.2"/>
      <path d="M9.9 16h14.9"/>
      <path d="M9.9 16C15 20.8 18.4 23.8 24.8 26.8"/>
      <circle cx="7" cy="16" r="2.8" fill="currentColor" stroke="none"/>
    </svg>
    <span>
      <b>Anticipation of Uncertainty</b>
      <i>UNCERTAINTY FORECASTING</i>
    </span>
  </div>

  <h1>别再把猜测<br>说得像<em>判断</em>。</h1>

  <p class="lead">每条预测都带置信度、可预测时域与推翻条件；<br>到期回头核对，用 Brier 分数告诉你到底准不准。</p>

  <div class="tags">
    <span class="tag hot">18 路实时数据源</span>
    <span class="tag">尺度分离</span>
    <span class="tag">涌现</span>
    <span class="tag">混沌</span>
    <span class="tag">反身性</span>
  </div>
</div>
</body>
</html>
